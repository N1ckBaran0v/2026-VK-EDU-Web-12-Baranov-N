<h3>Популярные теги</h3>
<div class="row">
    <div class="col">
        {% for tag in popular_tags %}
            <a href="{% url 'tag' tag %}" class="text-decoration-none">
                <span class="badge text-{% cycle 'primary' 'secondary' 'success' 'danger' 'warning' 'info' %}">
                    {{ tag }}
                </span>
            </a>
        {% empty %}
            <span class="text-muted">Тегов пока нет</span>
        {% endfor %}
    </div>
</div>

<h3 class="mt-5">Лучшие пользователи</h3>
<div>
    {% for u in top_users %}
        <span class="d-block">{{ u }}</span>
    {% empty %}
        <span class="text-muted">Нет данных</span>
    {% endfor %}
</div>
